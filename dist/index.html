<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d09">
  <meta name="description" content="10モードで遊べる、完全ローカル辞書の5文字英単語リレーゲーム。">
  <link rel="icon" href="data:,">
  <title>WORD LOGIC RELAY</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen active" aria-labelledby="gameTitle">
      <header class="title-mark">
        <p class="eyebrow">FIVE LETTER RELAY</p>
        <h1 id="gameTitle"><span>WORD</span><span>LOGIC</span></h1>
        <p class="title-rule" aria-hidden="true"><span></span>◆<span></span></p>
      </header>

      <div class="selector-panel">
        <div class="section-heading"><span>DIFFICULTY</span></div>
        <div class="difficulty-rack" role="group" aria-label="Difficulty">
          <button class="difficulty active" type="button" data-difficulty="easy" aria-pressed="true">
            <b>EASY</b><small>COMMON WORDS</small>
          </button>
          <button class="difficulty" type="button" data-difficulty="hard" aria-pressed="false">
            <b>HARD</b><small>OBSCURE WORDS</small>
          </button>
        </div>

        <div class="section-heading"><span>NORMAL</span></div>
        <div class="mode-grid normal-grid">
          <button class="mode" data-mode="1" data-special="normal"><b>SOLO</b><small>1 WORD · 6</small></button>
          <button class="mode" data-mode="2" data-special="normal"><b>DUO</b><small>2 WORDS · 7</small></button>
          <button class="mode" data-mode="3" data-special="normal"><b>TRIO</b><small>3 WORDS · 8</small></button>
          <button class="mode" data-mode="4" data-special="normal"><b>FOUR</b><small>4 WORDS · 9</small></button>
          <button class="mode" data-mode="5" data-special="normal"><b>FIVE</b><small>5 WORDS · 10</small></button>
          <button class="mode" data-mode="6" data-special="normal"><b>SIX</b><small>6 WORDS · 11</small></button>
        </div>

        <div class="section-heading"><span>SPECIAL</span></div>
        <div class="mode-grid special-grid">
          <button class="mode special boss" data-mode="6" data-special="boss"><b>BOSS</b><small>6 WORDS · 12</small></button>
          <button class="mode special blind" data-mode="4" data-special="blind"><b>BLIND</b><small>4 WORDS · 10</small></button>
          <button class="mode special time" data-mode="4" data-special="time"><b>TIME</b><small>4 WORDS · 3:00</small></button>
          <button class="mode special daily" data-mode="4" data-special="daily"><b>DAILY</b><small>JAPAN DATE · EASY</small></button>
        </div>
      </div>

      <footer class="title-help">
        <span><i class="mark correct"></i>RIGHT SPOT</span>
        <span><i class="mark present"></i>WRONG SPOT</span>
        <span><i class="mark absent"></i>NOT USED</span>
        <a href="licenses.html">CREDITS</a>
      </footer>
    </section>

    <section id="gameScreen" class="screen game-screen" aria-label="Game" hidden>
      <header class="game-bar">
        <button id="titleButton" class="icon-button" type="button" aria-label="タイトルに戻る">‹</button>
        <div class="game-brand"><span>WORD LOGIC</span><b id="modeName">EASY SOLO</b></div>
        <div class="meters"><b id="turnMeter">TRY 1 / 6</b><span id="smallStatus">0 / 1 SOLVED</span></div>
      </header>
      <div id="message" class="message" role="status" aria-live="polite">Make your first guess.</div>
      <div id="boardZone" class="board-zone"><div id="boards" class="boards"></div></div>
      <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
    </section>

    <div id="resultVeil" class="result-veil" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <section class="result-card">
        <p class="eyebrow" id="resultMode">EASY SOLO</p>
        <h2 id="resultTitle">CLEAR</h2>
        <p id="resultScore" class="result-score">4 / 6</p>
        <p class="answer-label">ANSWER WORDS <span>タップで意味を表示</span></p>
        <div id="answerList" class="answer-list"></div>
        <div id="definition" class="definition" tabindex="-1" aria-live="polite">
          <span class="definition-empty">単語を選ぶと日本語の意味が表示されます。</span>
        </div>
        <div class="result-actions">
          <button id="retryButton" class="command primary" type="button">PLAY AGAIN</button>
          <button id="changeModeButton" class="command" type="button">CHANGE MODE</button>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/words.js"></script>
  <script src="assets/game.js"></script>
</body>
</html>
